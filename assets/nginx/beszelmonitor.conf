# Beszel Monitor for TOS 7 — nginx 反代（WebUI External Open / 新标签页模式）
# 官方模板: help.terra-master.com → Deb Development Specification → Nginx Configuration
# 安装位置: /usr/local/beszelmonitor/nginx/beszelmonitor.conf
# 平台将其加载进 TOS nginx；location 前缀必须与 config.ini 的 path 一致
# proxy_pass 结尾的 / 会剥离 /beszelmonitor/ 前缀 → hub 以根路径原生工作（无子路径问题）

# 隐私政策精确路由（坑 45：C3 必备资产；= 精确匹配优先于下面的前缀反代，无冲突）
location = /beszelmonitor/privacy-policy.html {
    alias /usr/local/beszelmonitor/privacy-policy.html;
}

location /beszelmonitor/ {
    proxy_pass http://127.0.0.1:8090/;
    # 坑 13：应用 301 跳转（PocketBase /_/ 等默认后端跳转）不丢 :8181 端口
    absolute_redirect off;
    proxy_http_version 1.1;
    # 坑 14：PocketBase 会按 Host 生成绝对 URL（邮件/备份导出等），必须带端口
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket 升级（Beszel 实时指标流必需，在官方模板基础上追加）
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
}
